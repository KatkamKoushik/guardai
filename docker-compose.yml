services:
  guardai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://guardai_user:guardai_secret@postgres:5432/guardai_db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=guardai-local-development-secret-key-32chars
      - DB_POOL_MAX=15
      - DB_CONNECT_TIMEOUT_MS=5000
      - DB_IDLE_TIMEOUT_MS=30000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: guardai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: guardai_user
      POSTGRES_PASSWORD: guardai_secret
      POSTGRES_DB: guardai_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardai_user -d guardai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    driver: local

